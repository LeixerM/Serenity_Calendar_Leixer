serenity {
  project.name = "jQuery UI Datepicker - Serenity BDD"
  take.screenshots = FOR_EACH_ACTION
}

# Headless by default (CI); run with -Dheadless.mode=false to watch the browser locally.
headless.mode = true
headless.mode = ${?HEADLESS_MODE}

webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["window-size=1920,1080", "no-sandbox", "disable-dev-shm-usage", "disable-gpu", "remote-allow-origins=*"]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://jqueryui.com/datepicker/"
  }
}
